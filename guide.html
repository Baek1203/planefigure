  --line: #333B4D; --grout: #3E4656; --grout-edge: #98A3B6;
  --accent: #86A4FF; --accent-2: #25304D; --on-accent: #0D1118;
  --gold: #F0B93A; --bad: #F06A65; --good: #4CC285; --good-2: #1D3B2C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-sans); font-weight: 500;

/* ---------- 보는 틀 · 넘김 막대 ---------- */
#viewer { height: 100%; display: flex; flex-direction: column; }
#frame { flex: 1; min-height: 0; position: relative; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; }
#bar {
  display: flex; align-items: center; gap: 12px; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 6px 10px;
}
.nb { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.nb svg { width: 20px; height: 20px; }
.nb:hover { border-color: var(--ink-3); }
#dots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
#dots button { width: 10px; height: 10px; padding: 0; border-radius: 99px; border: 0; background: var(--line); cursor: pointer; transition: width .2s, background .2s; }
#dots button.on { background: var(--accent); width: 26px; }
#count { font-size: 14px; font-weight: 600; color: var(--ink-2); min-width: 54px; text-align: center; }
@media (max-width: 560px) { #dots { display: none; } }

/* ---------- 슬라이드 공통 ---------- */
.slide {
  position: absolute; inset: 0; background: var(--surface); border-radius: 28px; overflow: hidden;
  padding: 60px 84px 56px; display: flex; flex-direction: column; gap: 30px;
  line-height: 1.5; letter-spacing: -0.02em; word-break: keep-all; overflow-wrap: break-word; text-wrap: pretty;
  opacity: 0; visibility: hidden; transform: translateX(36px); transition: opacity .35s ease, transform .35s ease, visibility 0s .35s;
}
.slide.on { opacity: 1; visibility: visible; transform: none; transition: opacity .35s ease, transform .35s ease; }
.slide.past { transform: translateX(-36px); }
.slide b { font-weight: 750; color: var(--ink); }

/* 머리: 작은 표(도형 + 이름) 위에 큰 제목 */
.s-top { display: flex; flex-wrap: wrap; align-items: center; column-gap: 22px; row-gap: 10px; margin-bottom: 10px; }
.s-no { flex: 0 0 100%; display: flex; align-items: center; gap: 12px; font-size: 25px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; color: var(--accent); }
.s-no svg { width: 28px; height: 28px; flex: none; }
.s-title { margin: 0; font-size: 72px; font-weight: 800; line-height: 1.12; letter-spacing: -0.04em; text-wrap: balance; }
.s-tag { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: var(--accent); background: var(--accent-2); border-radius: 99px; padding: 7px 20px; }
.s-lead { margin: 0; font-size: 34px; font-weight: 500; line-height: 1.5; letter-spacing: -0.03em; color: var(--ink-2); }

/* 두 칸 */
.cols { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 60px; align-items: stretch; }
.cols.wide-r { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); }
.txt { display: flex; flex-direction: column; gap: 22px; justify-content: center; min-width: 0; }

/* 도형 글머리 */
.pts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 28px; }
.pts li { position: relative; padding-left: 50px; font-size: 32px; line-height: 1.5; letter-spacing: -0.03em; }
.pts li::before { content: ""; position: absolute; left: 4px; top: 14px; width: 21px; height: 21px; background: var(--c3); clip-path: polygon(50% 4%, 100% 92%, 0 92%); }
.pts li:nth-child(2)::before { background: var(--c4); clip-path: inset(6% round 3px); }
.pts li:nth-child(3)::before { background: var(--c6); clip-path: polygon(25% 7%, 75% 7%, 100% 50%, 75% 93%, 25% 93%, 0 50%); }
.pts li:nth-child(4)::before { background: var(--c8); clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }

/* 번호 차례 */
ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 30px; counter-reset: st; }
ol.steps li { counter-increment: st; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 22px; align-items: start; font-size: 32px; line-height: 1.5; letter-spacing: -0.03em; }
ol.steps li::before {
  content: counter(st); width: 52px; height: 52px; margin-top: -2px; border-radius: 15px; display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent); font-size: 27px; font-weight: 800; letter-spacing: 0; font-variant-numeric: tabular-nums;

/* 그림 판 */

  font-family: var(--f-sans); font-size: .74em; font-weight: 700; line-height: 1.5; letter-spacing: 0; color: var(--ink);

/* 시작하기: 주소 칸과 들어가기 화면 */
.addr {
  display: inline-block; min-width: 520px; margin-top: 10px; padding: 8px 20px; border-radius: 14px; outline: none; word-break: break-all;

/* 파일에 적어 둔 주소: 고칠 수 없는 칸. l·I·1, 0·O가 헷갈리지 않는 글자 모양(ss06, zero)으로 */

.mock { width: 82%; background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 36px 40px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 2px 4px rgba(16, 24, 40, .04), 0 18px 44px rgba(16, 24, 40, .12); }

/* 별 */
.stars-row { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.18fr); gap: 26px; }
.starbox { min-width: 0; background: var(--board); border-radius: 26px; padding: 40px 46px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }

.starbox .st2 svg { width: 76px; height: 76px; }
.starbox h3 { margin: 0; font-size: 42px; font-weight: 800; line-height: 1.2; letter-spacing: -0.045em; }
.starbox p { margin: 0; font-size: 30px; line-height: 1.5; color: var(--ink-2); letter-spacing: -0.03em; }
.r2 { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.r2 li { display: grid; grid-template-columns: 214px minmax(0, 1fr); gap: 18px; align-items: center; }
.r2 li span { justify-self: start; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px 12px; }
.r2 li em { font-style: normal; font-size: 30px; line-height: 1.4; letter-spacing: -0.03em; color: var(--ink-2); }
.star-on { fill: var(--gold); } .star-off { fill: none; stroke: var(--ink-3); stroke-width: 1.4; }
.note { margin: 0; display: flex; align-items: center; gap: 16px; font-size: 27px; line-height: 1.45; letter-spacing: -0.03em; color: var(--ink-2); background: var(--board); border-radius: 20px; padding: 18px 26px; }
.note svg { width: 34px; height: 34px; flex: none; }

/* 1·2단계 그림 */
.thumbs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 18px; width: 100%; height: 100%; padding: 22px; }
.thumbs .th { min-height: 0; background: var(--surface); border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 18px 16px 16px; }
.thumbs .th svg { flex: 1 1 0; min-height: 0; width: 100%; max-height: 230px; }
.thumbs .th span { font-size: 24px; font-weight: 700; letter-spacing: -0.03em; }
.thumbs .th span em { font-style: normal; font-weight: 700; color: var(--ink-3); margin-right: 10px; font-variant-numeric: tabular-nums; letter-spacing: 0; }

/* 도감 */
.dexgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; align-content: center; padding: 28px; width: 100%; }
.dexgrid div { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 18px; border: 2px dashed var(--line); background: var(--surface); display: grid; place-items: center; font-size: 42px; font-weight: 800; color: var(--ink-3); }
.dexgrid div.got { border-style: solid; border-color: var(--ink-3); }
.dexgrid div svg { width: 82%; height: 82%; }

/* 5단계: 차례 막대와 미션 */
.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); counter-reset: fl; }
.flow li { counter-increment: fl; position: relative; min-width: 0; padding: 64px 20px 0 0; display: flex; flex-direction: column; gap: 4px; }
.flow li::before {
  content: counter(fl); position: absolute; left: 0; top: 0; z-index: 1; width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-size: 22px; font-weight: 800; letter-spacing: 0;
}
.flow li::after { content: ""; position: absolute; left: 46px; right: 0; top: 21px; height: 4px; background: var(--accent-2); }
.flow li:last-child::after { display: none; }
.flow b { font-size: 29px; font-weight: 800; line-height: 1.3; letter-spacing: -0.04em; }
.flow small { font-size: 22px; line-height: 1.4; color: var(--ink-2); letter-spacing: -0.02em; }
.cardgrid.mis .ccard { gap: 10px; padding: 28px 32px; }
.m-art { height: 184px; display: flex; align-items: center; margin-bottom: 10px; }
.m-art svg { height: 100%; width: auto; }
.m-no { align-self: flex-start; font-size: 21px; font-weight: 800; letter-spacing: 0; color: var(--accent); background: var(--accent-2); border-radius: 99px; padding: 4px 14px; }
.cardgrid.mis h3 { font-size: 33px; }
.cardgrid.mis p { font-size: 26px; }

/* 표지 */
.cover { padding: 0; flex-direction: row; gap: 0; }
.cover .cv-l { width: 54%; padding: 0 0 0 104px; display: flex; flex-direction: column; justify-content: center; gap: 30px; position: relative; z-index: 1; }
.cover .eyebrow { display: flex; align-items: center; gap: 16px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--accent); }
.cover .pcs { display: flex; gap: 6px; }
.cover .pcs svg { width: 30px; height: 30px; }
.cover h1 { margin: 0 0 0 -6px; font-size: 186px; font-weight: 900; line-height: 1; letter-spacing: -0.055em; white-space: nowrap; }
.cover .sub { margin: 0; font-size: 40px; font-weight: 500; line-height: 1.45; letter-spacing: -0.035em; color: var(--ink-2); }
.cover .sub b { font-weight: 800; }
.cover .hint { position: absolute; left: 104px; bottom: 60px; display: flex; align-items: center; gap: 12px; font-size: 22px; letter-spacing: -0.02em; color: var(--ink-3); }
.cover .hint .key { font-size: 19px; }
.cover .cv-r { position: absolute; right: -140px; top: -80px; bottom: -80px; width: 58%; -webkit-mask-image: linear-gradient(to right, transparent 0, #000 30%); mask-image: linear-gradient(to right, transparent 0, #000 30%); }
.cover .cv-r svg { width: 100%; height: 100%; }

/* 요약 */
.sum { padding: 48px 64px 44px; gap: 24px; }
.sum .s-top { margin-bottom: 0; }
.sum .s-title { font-size: 58px; }
.sumgrid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 20px; }
.sumc { min-width: 0; min-height: 0; background: var(--board); border-radius: 24px; padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; }
.sumc h3 { margin: 0; display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 800; line-height: 1.2; letter-spacing: -0.04em; }
.sumc h3 i { font-style: normal; flex: none; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-size: 21px; font-weight: 800; letter-spacing: 0; }
.sumc ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.sumc li { position: relative; padding-left: 22px; font-size: 27px; line-height: 1.45; letter-spacing: -0.03em; color: var(--ink-2); }
.sumc li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 8px; height: 8px; border-radius: 2px; background: var(--ink-3); }
.sumc li.ad { padding-left: 0; }
.sumc li.ad::before { display: none; }
.sumc .addr { min-width: 0; width: 100%; margin-top: 0; font-size: 22px; padding: 6px 14px; }
.sumc .addr.fixed { font-size: 25px; }
.lvls { display: flex; flex-direction: column; gap: 9px; }
.lvls div { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: center; font-size: 26px; line-height: 1.35; letter-spacing: -0.03em; color: var(--ink-2); }
.lvls div b { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-2); color: var(--accent); font-size: 19px; font-weight: 800; letter-spacing: 0; }
.lvls div.five b { background: var(--board-2); color: var(--ink-3); }
@media (prefers-reduced-motion: reduce) { .slide { transition: none; } }

<div id="viewer">
  <div id="frame"><div id="stage" aria-live="polite"></div></div>
  <nav id="bar" aria-label="슬라이드 이동">
    <button class="nb" id="prev" aria-label="이전 슬라이드"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div id="dots"></div>
    <span id="count" class="mono"></span>
    <button class="nb" id="next" aria-label="다음 슬라이드"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="nb" id="fs" aria-label="전체 화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </nav>
</div>

<script>
/* ===== 빈틈없이 : 기하 엔진 ===== */
const Geo = (() => {
  const TAU = Math.PI * 2;
  const D2R = Math.PI / 180;
  const TYPES = [3, 4, 5, 6, 8, 12];
  const interior = n => 180 * (n - 2) / n;
  const unitArea = n => n / (4 * Math.tan(Math.PI / n));

  /* 변 P→Q 의 왼쪽(반시계)에 정n각형을 만든다. v0=P, v1=Q */
  function polyOnEdge(n, P, Q) {
    const v = [[P[0], P[1]], [Q[0], Q[1]]];
    let h = Math.atan2(Q[1] - P[1], Q[0] - P[0]);
    let x = Q[0], y = Q[1];
    for (let i = 2; i < n; i++) {
      h += TAU / n;
      x += Math.cos(h); y += Math.sin(h);
      v.push([x, y]);
    }
    return v;
  }

  /* 중심과 회전으로 정n각형 (rot=0 이면 아랫변이 수평) */
  function regular(n, cx, cy, rotDeg) {
    const R = 1 / (2 * Math.sin(Math.PI / n));
    const v = [];
    for (let i = 0; i < n; i++) {
      const a = (rotDeg - 90 - 180 / n + i * 360 / n) * D2R;
      v.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]);
    }
    return v;
  }

  /* 꼭짓점 C 에서 방향 startDeg 로 첫 변을 내는 정n각형 (C가 v0) */
  function polyAtCorner(n, C, startDeg) {
    const a = startDeg * D2R;
    return polyOnEdge(n, C, [C[0] + Math.cos(a), C[1] + Math.sin(a)]);
  }

  function centroid(v) {
    let x = 0, y = 0;
    for (const p of v) { x += p[0]; y += p[1]; }
    return [x / v.length, y / v.length];
  }
  function area(v) {
    let s = 0;
    for (let i = 0; i < v.length; i++) {
      const a = v[i], b = v[(i + 1) % v.length];
      s += a[0] * b[1] - a[1] * b[0];
    }
    return s / 2;
  }
  function bbox(v) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of v) {
      if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
      if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
    }
    return [x0, y0, x1, y1];

  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const NS = 'http://www.w3.org/2000/svg';
  const ICON = C.ICON;
  const STAR = C.STAR;

  /* ---------- SVG 도우미 ---------- */
  function svgBox(box, w, h) {
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', `0 0 ${w} ${h}`); s.setAttribute('class', 'dsvg'); s.setAttribute('aria-hidden', 'true');
    const bw = box[2] - box[0], bh = box[3] - box[1];
    const k = Math.min(w / bw, h / bh);
    const ox = (w - bw * k) / 2, oy = (h - bh * k) / 2;
    s.X = p => ox + (p[0] - box[0]) * k; s.Y = p => oy + (box[3] - p[1]) * k; s.k = k;
    return s;
  }
  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k of Object.keys(attrs)) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  const pts = (s, v) => v.map(p => s.X(p).toFixed(1) + ',' + s.Y(p).toFixed(1)).join(' ');
  function poly(s, v, n, parent, extra = {}) {
    return el('polygon', Object.assign({ points: pts(s, v), style: `fill:var(--c${n});stroke:rgba(0,0,0,.45);stroke-width:2;stroke-linejoin:round` }, extra), parent || s);
  }
  function grout(s, polys, parent) {
    const g = el('g', {}, parent || s);
    el('path', { d: polys.map(v => 'M' + pts(s, v).replace(/ /g, 'L') + 'Z').join(''), style: 'fill:var(--grout)' }, g);
    const seg = G.boundarySegments(polys);
    el('path', { d: seg.map(e => `M${s.X(e.a)},${s.Y(e.a)}L${s.X(e.b)},${s.Y(e.b)}`).join(''), style: 'fill:none;stroke:var(--grout-edge);stroke-width:3;stroke-linecap:round' }, g);
    return g;
  }
  const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
  const lerp = (a, b, t) => a + (b - a) * t;
  const moveV = (v, dx, dy) => v.map(p => [p[0] + dx, p[1] + dy]);
  /* 시간 따라 그리는 장면 */
  function loop(fn) {
    let raf = 0, t0 = performance.now(), on = true;
    const tick = now => { if (!on) return; fn((now - t0) / 1000); raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
    return () => { on = false; cancelAnimationFrame(raf); };
  }
  const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 장면 1 : 표지 무늬 ---------- */
  function coverDemo(host) {
    const pcs = T.tiling('4.6.12', c => Math.hypot(c[0], c[1]) < 9.5, { rootPar: 4 })
      .map(p => ({ p, d: Math.hypot(...G.centroid(p.v)) })).sort((a, b) => a.d - b.d);
    const s = svgBox([-8.5, -8.5, 8.5, 8.5], 900, 900);
    host.appendChild(s);
    const items = pcs.map(o => { const e = poly(s, o.p.v, o.p.n, s, { opacity: 0 }); return { e, d: o.d }; });
    return loop(t => {
      for (const it of items) {
        const k = REDUCE ? 1 : ease((t * 2.2 - it.d * 0.55));
        it.e.setAttribute('opacity', (k * 0.92).toFixed(2));
      }
    });
  }

  /* ---------- 장면 2 : 끌어다 놓기 ---------- */
  function dragDemo(host) {
    const s = svgBox([-2.6, -3.15, 3.6, 3.1], 700, 700);
    host.appendChild(s);
    const b = new T.Builder(); b.root(4, 0, 0); b.add(3, 0, 2);
    const [sq, tri] = b.pieces();
    const reg = grout(s, [sq.v, tri.v]);
    // 받침
    el('rect', { x: s.X([-2.4, 0]), y: s.Y([0, -1.85]), width: (5.8) * s.k, height: 1.2 * s.k, rx: 18, style: 'fill:var(--surface);stroke:var(--line);stroke-width:2' }, s);
    const traySq = moveV(G.regular(4, -1.1, -2.45, 0), 0, 0), trayTri = G.regular(3, 1.6, -2.42, 0);
    poly(s, traySq, 4, s, { opacity: .35 }); poly(s, trayTri, 3, s, { opacity: .35 });
    const ghost = el('polygon', { points: '', style: 'fill:var(--bad);fill-opacity:.25;stroke:var(--bad);stroke-width:3;stroke-dasharray:10 7', opacity: 0 }, s);
    const mSq = poly(s, traySq, 4, s); const mTri = poly(s, trayTri, 3, s);
    const flash = el('path', { d: reg.firstChild.getAttribute('d'), style: 'fill:var(--gold)', opacity: 0 }, s);
    const cur = el('path', { d: 'M0 0 L0 30 L8 23 L13 35 L19 32 L14 21 L24 21 Z', style: 'fill:var(--ink);stroke:var(--surface);stroke-width:2;stroke-linejoin:round' }, s);
    const done = el('g', { opacity: 0 }, s);
    el('rect', { x: 226, y: 24, width: 248, height: 76, rx: 38, style: 'fill:var(--surface);stroke:var(--line);stroke-width:2' }, done);
    const dt = el('text', { x: 262, y: 75, style: 'font-family:var(--f-sans);font-weight:800;font-size:37px;letter-spacing:-1px;fill:var(--ink)' }, done); dt.textContent = '완성!';
    const stars = done;
    for (let i = 0; i < 2; i++) el('path', { d: 'M12 2.6l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.9 6.2 20.1l1.4-6.4L2.7 9.3l6.5-.7z', transform: `translate(${358 + i * 44},41) scale(1.75)`, style: 'fill:var(--gold)' }, stars);
    const cSq = G.centroid(sq.v), cTri = G.centroid(tri.v);
    const tSqC = G.centroid(traySq), tTriC = G.centroid(trayTri);
    const wrongTri = G.polyOnEdge(3, sq.v[2], sq.v[1]); // 네모 오른쪽 바깥
    const cWrong = G.centroid(wrongTri);
    const setPoly = (e, v) => e.setAttribute('points', pts(s, v));
    const setCur = p => cur.setAttribute('transform', `translate(${s.X(p) + 4},${s.Y(p) + 4})`);
    const path = (a, b, t, lift = 0.6) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t) + Math.sin(Math.PI * t) * lift];
    return loop(T0 => {
      const t = REDUCE ? 9 : T0 % 8.2;
      // 네모
      let pSq;
      if (t < 0.5) { setCur(path([2.6, 0.4], tSqC, ease(t / 0.5), 0)); pSq = tSqC; }
      else if (t < 1.8) { const k = ease((t - 0.5) / 1.3); pSq = path(tSqC, [cSq[0] + 0.28, cSq[1] + 0.12], k, 0.7); setCur(pSq); }
      else pSq = cSq;
      setPoly(mSq, t < 1.8 ? moveV(sq.v, pSq[0] - cSq[0], pSq[1] - cSq[1]) : sq.v);
      if (t >= 1.8 && t < 2.0) mSq.setAttribute('transform', `translate(${s.X(cSq)},${s.Y(cSq)}) scale(${1 + 0.08 * Math.sin((t - 1.8) / 0.2 * Math.PI)}) translate(${-s.X(cSq)},${-s.Y(cSq)})`); else mSq.removeAttribute('transform');
      // 세모 : 잘못된 자리(빨간 점선)를 지나 지붕으로
      let pTri = tTriC; ghost.setAttribute('opacity', 0);
      if (t >= 2.0 && t < 2.5) setCur(path(cSq, tTriC, ease((t - 2.0) / 0.5), 0));
      else if (t >= 2.5 && t < 3.5) { pTri = path(tTriC, [cWrong[0] + 0.15, cWrong[1] - 0.05], ease((t - 2.5) / 1.0), 0.4); setCur(pTri); if (t > 3.1) { setPoly(ghost, wrongTri); ghost.setAttribute('opacity', 1); } }
      else if (t >= 3.5 && t < 4.1) { pTri = [cWrong[0] + 0.15, cWrong[1] - 0.05]; setCur(pTri); setPoly(ghost, wrongTri); ghost.setAttribute('opacity', 1); }
      else if (t >= 4.1 && t < 5.0) { pTri = path([cWrong[0] + 0.15, cWrong[1] - 0.05], [cTri[0] + 0.2, cTri[1] + 0.15], ease((t - 4.1) / 0.9), 0.3); setCur(pTri); }
      else if (t >= 5.0) { pTri = cTri; if (t < 5.4) setCur([cTri[0] + 0.2, cTri[1] + 0.15]); else setCur(path([cTri[0] + 0.2, cTri[1] + 0.15], [2.6, 0.4], ease((t - 5.4) / 0.6), 0)); }
      setPoly(mTri, moveV(tri.v, pTri[0] - cTri[0], pTri[1] - cTri[1]));
      flash.setAttribute('opacity', t > 5.1 && t < 6.0 ? (0.5 * (1 - (t - 5.1) / 0.9)).toFixed(2) : 0);
      const dn = t > 5.4 ? Math.min(1, (t - 5.4) / 0.3) : 0;
      done.setAttribute('opacity', dn);
    });
  }

  /* ---------- 장면 3 : 한 점에 모으기 고리 ---------- */
  function ringDemo(host) {
    const s = svgBox([-2.5, -2.4, 2.5, 2.6], 700, 700);
    host.appendChild(s);
    el('circle', { cx: s.X([0, 0]), cy: s.Y([0, 0]), r: 1.65 * s.k, style: 'fill:var(--grout);opacity:.35' }, s);
    const tris = [];
    for (let i = 0; i < 6; i++) tris.push(poly(s, G.polyAtCorner(3, [0, 0], 30 + i * 60), 3, s, { opacity: 0 }));
    const R = 0.55 * s.k, cx = s.X([0, 0]), cy = s.Y([0, 0]);
    el('circle', { cx, cy, r: R, style: 'fill:none;stroke:var(--ink-3);stroke-width:3;stroke-dasharray:5 7' }, s);
    const arcs = []; for (let i = 0; i < 6; i++) arcs.push(el('path', { d: '', style: 'fill:none;stroke-width:12;stroke-linecap:butt' }, s));
    el('circle', { cx, cy, r: 9, style: 'fill:var(--ink);stroke:var(--surface);stroke-width:3' }, s);
    const pill = el('g', {}, s);
    const pr = el('rect', { x: cx - 84, y: 36, width: 168, height: 58, rx: 29, style: 'fill:var(--surface);stroke:var(--line);stroke-width:2' }, pill);
    const tx = el('text', { x: cx, y: 76, 'text-anchor': 'middle', style: 'font-family:var(--f-sans);font-weight:800;font-size:31px;font-variant-numeric:tabular-nums;fill:var(--ink)' }, pill);
    const arc = (a0, a1) => { const p = a => [cx + R * Math.cos(a), cy - R * Math.sin(a)]; const A = p(a0), B = p(a1); return `M${A[0]},${A[1]} A${R},${R} 0 0 0 ${B[0]},${B[1]}`; };
    return loop(T0 => {
      const t = REDUCE ? 6 : T0 % 7.6;
      let k = 0;
      for (let i = 0; i < 6; i++) {
        const st = 0.5 + i * 0.75;
        const on = t > st;
        if (on) k++;
        const pop = on ? 1 + 0.1 * Math.max(0, 1 - (t - st) / 0.25) : 1;
        tris[i].setAttribute('opacity', on ? 1 : 0);
        const c = G.centroid(G.polyAtCorner(3, [0, 0], 30 + i * 60));
        tris[i].setAttribute('transform', `translate(${s.X(c)},${s.Y(c)}) scale(${pop}) translate(${-s.X(c)},${-s.Y(c)})`);
        const a0 = (30 + i * 60) * Math.PI / 180;
        arcs[i].setAttribute('d', on ? arc(a0, a0 + Math.PI / 3 - 0.001) : '');
      }
      const full = k === 6;
      for (const a of arcs) a.style.stroke = full ? 'var(--gold)' : '#2C7A4A';
      tx.textContent = (k * 60) + '°' + (full ? ' ✓' : '');
      pr.style.fill = full ? 'var(--gold)' : 'var(--surface)';
      pr.style.stroke = full ? 'var(--gold)' : 'var(--line)';
    });
  }

  /* ---------- 장면 4 : 무늬 채우기와 끝없이 이어 보기 ---------- */
  function tileDemo(host) {
    const inner = T.connectedFrom(T.tiling('3.4.6.4', c => Math.hypot(c[0], c[1]) < 2.4));
    const outer = T.tiling('3.4.6.4', c => Math.hypot(c[0], c[1]) < 5.2);
    const key = p => { const c = G.centroid(p.v); return p.n + ':' + c[0].toFixed(2) + ',' + c[1].toFixed(2); };
    const inSet = new Set(inner.map(key));
    const ext = outer.filter(p => !inSet.has(key(p)));
    const s = svgBox([-4.6, -4.2, 4.6, 4.2], 760, 700);
    host.appendChild(s);
    const reg = grout(s, inner.map(p => p.v));
    const sortD = arr => arr.map(p => ({ p, d: Math.hypot(...G.centroid(p.v)) })).sort((a, b) => a.d - b.d);
    const A = sortD(inner).map((o, i) => ({ e: poly(s, o.p.v, o.p.n, s, { opacity: 0 }), i }));
    const B = sortD(ext).map((o, i) => ({ e: poly(s, o.p.v, o.p.n, s, { opacity: 0 }), i }));
    // 꽉 찬 꼭짓점 점
    const vs = G.analyzeVertices(inner.map(p => p.v)).filter(v => Math.abs(v.sum - 360) < 0.01);
    const dots = vs.map(v => el('circle', { cx: s.X([v.x, v.y]), cy: s.Y([v.x, v.y]), r: 6, style: 'fill:var(--gold);stroke:var(--ink);stroke-width:2', opacity: 0 }, s));
    const lab = el('g', { opacity: 0 }, s);
    el('rect', { x: 120, y: 18, width: 520, height: 60, rx: 30, style: 'fill:var(--surface);stroke:var(--line);stroke-width:2' }, lab);
    const lt = el('text', { x: 380, y: 58, 'text-anchor': 'middle', style: 'font-family:var(--f-sans);font-weight:700;font-size:28px;letter-spacing:-0.6px;fill:var(--ink)' }, lab);
    lt.textContent = '꽉 찬 꼭짓점이 모두 3.4.6.4';
    return loop(T0 => {
      const t = REDUCE ? 12 : T0 % 12.5;
      const fillEnd = 0.6 + A.length * 0.11;
      for (const a of A) a.e.setAttribute('opacity', t > 0.6 + a.i * 0.11 ? 1 : 0);
      const dOn = t > fillEnd + 0.2 && t < fillEnd + 2.6;
      for (const d of dots) d.setAttribute('opacity', dOn ? 1 : 0);
      lab.setAttribute('opacity', dOn ? 1 : 0);
      const extStart = fillEnd + 2.8;
      for (const b of B) b.e.setAttribute('opacity', t > extStart + b.i * 0.025 ? 0.55 : 0);
      reg.setAttribute('opacity', t > extStart ? 0 : 1);
    });
  }

  /* ---------- 작은 그림 ---------- */
  // 밑변이 바닥에 놓인 정다각형 아이콘
  function polyIcon(n) {
    const P = [];
    for (let k = 0; k < n; k++) { const a = (-90 + 180 / n + k * 360 / n) * Math.PI / 180; P.push([Math.cos(a), -Math.sin(a)]); }
    const xs = P.map(p => p[0]), ys = P.map(p => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const k = 88 / Math.max(x1 - x0, y1 - y0), ox = 50 - (x0 + x1) / 2 * k, oy = 50 - (y0 + y1) / 2 * k;
    const d = P.map(p => (ox + p[0] * k).toFixed(1) + ',' + (oy + p[1] * k).toFixed(1)).join(' ');
    return `<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="${d}" style="fill:var(--c${n});stroke:rgba(0,0,0,.28);stroke-width:3;stroke-linejoin:round"/></svg>`;
  }
  const eb = (n, t) => `<span class="s-no">${polyIcon(n)}${t}</span>`;
  // 5단계 미션 그림
  function missionArt(kind) {
    const near = r => c => Math.hypot(c[0], c[1]) < r;
    if (kind === 1) return C.svgOfPolys(T.tiling('6.6.6', near(1.9)).map(p => ({ v: p.v, n: p.n, kind: 'piece' })), { pad: 0.12 });
    if (kind === 2) return C.svgOfPolys(T.tiling('4.8.8', near(2.5)).map(p => ({ v: p.v, n: p.n, kind: 'piece' })), { pad: 0.12 });
    const pcs = T.connectedFrom(T.tiling('3.4.6.4', near(1.9)));
    const v = pcs.map(p => p.v);
    const items = v.map(x => ({ v: x, kind: 'grout' })).concat(pcs.slice(0, 3).map(p => ({ v: p.v, n: p.n, kind: 'piece' })));
    return C.svgOfPolys(items, { pad: 0.12, edges: G.boundarySegments(v), edgeW: 1.8 });
  }
  function levelThumb(id) {
    const d = Levels.L.find(x => x.id === id);
    const v = d.sol.map(p => p.v);
    return C.svgOfPolys(v.map(x => ({ v: x, kind: 'grout' })), { edges: G.boundarySegments(v), edgeW: 1.6 });
  }
  function ruleArt(kind) {
    const C6 = [0, 0];
    const hex = G.regular(6, 0, 0, 0);
    const b = new T.Builder(); b.fan(3, 6, C6, 0); const tri6 = b.pieces();
    let items = [{ v: hex, kind: 'grout' }];
    if (kind === 'ok') items = items.concat(tri6.map(p => ({ v: p.v, n: 3, kind: 'piece' })));
    if (kind === 'gap') items = items.concat(tri6.slice(0, 5).map(p => ({ v: p.v, n: 3, kind: 'piece' })));
    if (kind === 'over') items = items.concat([{ v: G.regular(6, 0.35, 0.15, 0), n: 6, kind: 'piece' }, { v: tri6[4].v, n: 3, kind: 'piece' }]);
    let svg = C.svgOfPolys(items, { pad: 0.35, edges: G.boundarySegments([hex]), edgeW: 1.6 });
    return svg;
  }

  // 별 장 그림: 힌트 금지, 적은 조각, 꽃 세 송이
  const nest = (svg, x, y, w, h) => svg.replace('<svg ', `<svg x="${x}" y="${y}" width="${w}" height="${h}" `);
  function hintArt() {
    return `<svg viewBox="0 0 320 170" aria-hidden="true"><g transform="translate(113,38) scale(4)" style="fill:none;stroke:var(--ink-3);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></g>
      <circle cx="160" cy="85" r="70" style="fill:none;stroke:var(--bad);stroke-width:9"/><path d="M111 36L209 134" style="stroke:var(--bad);stroke-width:9;stroke-linecap:round"/></svg>`;
  }
  function fewArt() {
    const b = new T.Builder(); b.fan(3, 6, [0, 0], 0); const tri6 = b.pieces();
    const hex = G.regular(6, 0, 0, 0);
    const six = C.svgOfPolys(tri6.map(p => ({ v: p.v, n: 3, kind: 'piece' })), { pad: 0.1 });
    const one = C.svgOfPolys([{ v: hex, n: 6, kind: 'piece' }], { pad: 0.1 });
    const lab = (x, t, c) => `<text x="${x}" y="164" text-anchor="middle" style="font-family:var(--f-sans);font-weight:800;font-size:27px;fill:var(--${c})">${t}</text>`;
    return `<svg viewBox="0 0 320 184" aria-hidden="true">${nest(six, 14, 4, 122, 122)}${nest(one, 184, 4, 122, 122)}
      <path d="M144 65H170M161 55l11 10-11 10" style="fill:none;stroke:var(--ink-3);stroke-width:4;stroke-linecap:round;stroke-linejoin:round"/>${lab(75, '6개', 'ink-3')}${lab(245, '1개', 'ink')}</svg>`;
  }
  function flowersArt() {
    const f = ['3.3.3.3.3.3', '4.4.4.4', '6.6.6'].map((c, i) => nest(C.flowerSVG(c), 6 + i * 104, 22, 100, 100)).join('');
    return `<svg viewBox="0 0 320 170" aria-hidden="true">${f}</svg>`;
  }

  /* ---------- 주소 칸 ----------
     1) 파일 맨 위 student-link 자리에 적어 둔 주소 → 어느 컴퓨터에서 열어도 그대로 보임
     2) 비어 있으면 슬라이드의 칸을 눌러 적기 (그 브라우저에만 남음) */
  const LINK = (() => {
    const n = document.getElementById('student-link');
    const line = n ? (n.textContent.split(/\r?\n/).map(s => s.trim()).find(Boolean) || '') : '';
    return line.replace(/^[\s'"`<“‘]+|[\s'"`>”’;,]+$/g, '');
  })();
  let ADDR = '';
  if (!LINK) { try { ADDR = localStorage.getItem('binteum.guide.addr') || ''; } catch (e) { } }
  function addrBox() {
    if (!LINK) return `<span class="addr" contenteditable="true" spellcheck="false" data-ph="선생님이 알려 주는 주소 (눌러서 적기)">${C.esc(ADDR)}</span>`;
    const shown = LINK.replace(/^https?:\/\//i, '');
    if (/\s/.test(LINK) || !/\./.test(shown)) return `<span class="addr fixed">${C.esc(LINK)}</span>`;
    const href = /^https?:\/\//i.test(LINK) ? LINK : 'https://' + LINK;
    // 길면 '/'와 '.' 뒤에서 먼저 줄을 바꾸도록 <wbr>
    return `<a class="addr fixed" href="${C.esc(href)}" target="_blank" rel="noopener">${C.esc(shown).replace(/([/.])/g, '$1<wbr>')}</a>`;
  }
  // 고정 주소는 한 줄에 들어가도록 글자를 조금까지 줄여 본다 (그래도 길면 줄바꿈)
  function fitAddr() {
    for (const a of $$('.addr.fixed')) {
      const html = a.innerHTML;
      a.style.fontSize = '';
      let fs = parseFloat(getComputedStyle(a).fontSize); const min = Math.round(fs * 0.74);
      // 한 줄일 때의 높이(<wbr>은 nowrap에서도 줄을 바꿔서 잠깐 뺌)와 실제 높이를 견준다
      const oneLine = () => {
        a.style.whiteSpace = 'nowrap'; a.textContent = a.textContent; const h1 = a.offsetHeight;
        a.style.whiteSpace = ''; a.innerHTML = html; return a.offsetHeight <= h1 + 1;
      };
      while (!oneLine() && fs > min) { fs -= 1; a.style.fontSize = fs + 'px'; }
    }
  }

  }

  /* ---------- 그리기와 넘기기 ---------- */
  const stage = $('#stage');
  stage.innerHTML = S.map((s, i) => `<section class="slide ${s.cls}" data-i="${i}" aria-label="${i + 1} / ${S.length}">${s.html}</section>`).join('');
  $('#dots').innerHTML = S.map((s, i) => `<button aria-label="${i + 1}번 슬라이드" data-go="${i}"></button>`).join('');
  let cur = -1, stopFn = null;
  function go(i) {
    i = Math.max(0, Math.min(S.length - 1, i));
    if (i === cur) return;
    if (stopFn) { stopFn(); stopFn = null; }
    $$('.slide').forEach((el, k) => { el.classList.toggle('on', k === i); el.classList.toggle('past', k < i); });
    const sl = $$('.slide')[i];
    const host = sl.querySelector('[data-demo]');
    if (host && S[i].demo) { host.innerHTML = ''; stopFn = S[i].demo(host); }
    cur = i;
    $$('#dots button').forEach((b, k) => b.classList.toggle('on', k === i));
    $('#count').textContent = `${i + 1} / ${S.length}`;
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) { }
  }
  function fit() {
    const f = $('#frame').getBoundingClientRect();
    const k = Math.min(f.width / 1640, f.height / 930);
    stage.style.transform = `translate(${(f.width - 1600 * k) / 2}px, ${(f.height - 900 * k) / 2}px) scale(${k})`;
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe($('#frame'));
  const editing = () => !!(document.activeElement && document.activeElement.isContentEditable);
  const kbFocus = el => { try { return el.matches(':focus-visible'); } catch (e) { return false; } };
  document.addEventListener('keydown', e => {
    if (editing()) { if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); document.activeElement.blur(); } return; }
    const fa = document.activeElement;
    if (e.key === 'Enter' && fa && fa.tagName === 'A' && kbFocus(fa)) return;  // Tab으로 고른 주소 링크는 Enter로 열기
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(cur + 1); }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(S.length - 1);
    else if (e.key === 'f' || e.key === 'F' || e.key === 'ㄹ') toggleFS();
  });
  $('#prev').addEventListener('click', () => go(cur - 1));
  $('#next').addEventListener('click', () => go(cur + 1));
  $('#dots').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(+b.dataset.go); });
  function toggleFS() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else (document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : Promise.reject()).catch(() => { });
    } catch (e) { }
  }
  $('#fs').addEventListener('click', toggleFS);
  let down = null;
  $('#frame').addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: Date.now() }; });
  $('#frame').addEventListener('pointerup', e => {
    if (!down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y; const d0 = down; down = null;
    if (e.target.closest('.addr, a, button, input')) return;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) { go(cur + (dx < 0 ? 1 : -1)); return; }
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8 && Date.now() - d0.t < 600) {
      const f = $('#frame').getBoundingClientRect();
      go(cur + ((e.clientX - f.left) < f.width * 0.3 ? -1 : 1));
    }
  });
  // 주소 링크를 눌러 앱을 연 뒤 돌아와도 화살표·Enter로 바로 넘길 수 있게 초점을 풀어 둔다
  document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('a.addr'); if (a) setTimeout(() => a.blur(), 0); });
  document.addEventListener('input', e => {
    if (!e.target.classList || !e.target.classList.contains('addr')) return;
    ADDR = e.target.textContent.trim();
    try { localStorage.setItem('binteum.guide.addr', ADDR); } catch (err) { }
    for (const a of $$('.addr')) if (a !== e.target) a.textContent = ADDR;
  });
  fit();
  if (LINK) {  // 글꼴이 다 들어온 뒤의 글자 폭으로 다시 맞춘다
    fitAddr();
    try { document.fonts.load('750 34px "Binteum Sans"', LINK).then(fitAddr, fitAddr); document.fonts.ready.then(fitAddr); } catch (e) { }
  }
  const h = parseInt((location.hash || '').replace('#', ''), 10);
  go(isFinite(h) && h >= 1 ? h - 1 : 0);
  window.GUIDE = { go, count: S.length };
})();

</script>
</body>
</html>
