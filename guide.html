<script>
/* ===== 빈틈없이 : 기하 엔진 ===== */
const Geo = (() => {
  const TAU = Math.PI * 2;
  const D2R = Math.PI / 180;
  const TYPES = [3, 4, 5, 6, 8, 12];
  const interior = n => 180 * (n - 2) / n;
  const unitArea = n => n / (4 * Math.tan(Math.PI / n));

  /* 변 P→Q 의 왼쪽(반시계)에 정n각형을 만든다. v0=P, v1=Q */
  function polyOnEdge(n, P, Q) {
    const v = [[P[0], P[1]], [Q[0], Q[1]]];
    let h = Math.atan2(Q[1] - P[1], Q[0] - P[0]);
    let x = Q[0], y = Q[1];
    for (let i = 2; i < n; i++) {
      h += TAU / n;
      x += Math.cos(h); y += Math.sin(h);
      v.push([x, y]);
    }
    return v;
  }

  /* 중심과 회전으로 정n각형 (rot=0 이면 아랫변이 수평) */
  function regular(n, cx, cy, rotDeg) {
    const R = 1 / (2 * Math.sin(Math.PI / n));
    const v = [];
    for (let i = 0; i < n; i++) {
      const a = (rotDeg - 90 - 180 / n + i * 360 / n) * D2R;
      v.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]);
    }
    return v;
  }

  /* 꼭짓점 C 에서 방향 startDeg 로 첫 변을 내는 정n각형 (C가 v0) */
  function polyAtCorner(n, C, startDeg) {
    const a = startDeg * D2R;
    return polyOnEdge(n, C, [C[0] + Math.cos(a), C[1] + Math.sin(a)]);
  }

  function centroid(v) {
    let x = 0, y = 0;
    for (const p of v) { x += p[0]; y += p[1]; }
    return [x / v.length, y / v.length];
  }
  function area(v) {
    let s = 0;
    for (let i = 0; i < v.length; i++) {
      const a = v[i], b = v[(i + 1) % v.length];
      s += a[0] * b[1] - a[1] * b[0];
    }
    return s / 2;
  }
  function bbox(v) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of v) {
      if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
      if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
    }
    return [x0, y0, x1, y1];
  }
  function bboxHit(a, b, m = 0) {
    return !(a[2] < b[0] - m || b[2] < a[0] - m || a[3] < b[1] - m || b[3] < a[1] - m);
  }
  function bboxUnion(list) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const b of list) {
      if (b[0] < x0) x0 = b[0]; if (b[1] < y0) y0 = b[1];
      if (b[2] > x1) x1 = b[2]; if (b[3] > y1) y1 = b[3];
    }

    const ox = (w - bw * k) / 2, oy = (h - bh * k) / 2;

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);

  }
  const pts = (s, v) => v.map(p => s.X(p).toFixed(1) + ',' + s.Y(p).toFixed(1)).join(' ');
  function poly(s, v, n, parent, extra = {}) {
    return el('polygon', Object.assign({ points: pts(s, v), style: `fill:var(--c${n});stroke:rgba(0,0,0,.45);stroke-width:2;stroke-linejoin:round` }, extra), parent || s);
  }
  function grout(s, polys, parent) {
    const g = el('g', {}, parent || s);

    const seg = G.boundarySegments(polys);
    el('path', { d: seg.map(e => `M${s.X(e.a)},${s.Y(e.a)}L${s.X(e.b)},${s.Y(e.b)}`).join(''), style: 'fill:none;stroke:var(--grout-edge);stroke-width:3;stroke-linecap:round' }, g);

  const lerp = (a, b, t) => a + (b - a) * t;

  /* 시간 따라 그리는 장면 */
  function loop(fn) {
    let raf = 0, t0 = performance.now(), on = true;

  const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 장면 1 : 표지 무늬 ---------- */
  function coverDemo(host) {

      for (const it of items) {

    });
  }

  /* ---------- 장면 2 : 끌어다 놓기 ---------- */

    const [sq, tri] = b.pieces();

    // 받침
    el('rect', { x: s.X([-2.4, 0]), y: s.Y([0, -1.85]), width: (5.8) * s.k, height: 1.2 * s.k, rx: 18, style: 'fill:var(--surface);stroke:var(--line);stroke-width:2' }, s);
    const traySq = moveV(G.regular(4, -1.1, -2.45, 0), 0, 0), trayTri = G.regular(3, 1.6, -2.42, 0);

    const cur = el('path', { d: 'M0 0 L0 30 L8 23 L13 35 L19 32 L14 21 L24 21 Z', style: 'fill:var(--ink);stroke:var(--surface);stroke-width:2;stroke-linejoin:round' }, s);
    const done = el('g', { opacity: 0 }, s);
    el('rect', { x: 226, y: 24, width: 248, height: 76, rx: 38, style: 'fill:var(--surface);stroke:var(--line);stroke-width:2' }, done);
    const dt = el('text', { x: 262, y: 75, style: 'font-family:var(--f-sans);font-weight:800;font-size:37px;letter-spacing:-1px;fill:var(--ink)' }, done); dt.textContent = '완성!';

      const t = REDUCE ? 9 : T0 % 8.2;

      else if (t < 1.8) { const k = ease((t - 0.5) / 1.3); pSq = path(tSqC, [cSq[0] + 0.28, cSq[1] + 0.12], k, 0.7); setCur(pSq); }
      else pSq = cSq;
      setPoly(mSq, t < 1.8 ? moveV(sq.v, pSq[0] - cSq[0], pSq[1] - cSq[1]) : sq.v);
      if (t >= 1.8 && t < 2.0) mSq.setAttribute('transform', `translate(${s.X(cSq)},${s.Y(cSq)}) scale(${1 + 0.08 * Math.sin((t - 1.8) / 0.2 * Math.PI)}) translate(${-s.X(cSq)},${-s.Y(cSq)})`); else mSq.removeAttribute('transform');
      // 세모 : 잘못된 자리(빨간 점선)를 지나 지붕으로
      let pTri = tTriC; ghost.setAttribute('opacity', 0);
      if (t >= 2.0 && t < 2.5) setCur(path(cSq, tTriC, ease((t - 2.0) / 0.5), 0));
      else if (t >= 2.5 && t < 3.5) { pTri = path(tTriC, [cWrong[0] + 0.15, cWrong[1] - 0.05], ease((t - 2.5) / 1.0), 0.4); setCur(pTri); if (t > 3.1) { setPoly(ghost, wrongTri); ghost.setAttribute('opacity', 1); } }

  /* ---------- 장면 3 : 한 점에 모으기 고리 ---------- */
  function ringDemo(host) {

  /* ---------- 장면 4 : 무늬 채우기와 끝없이 이어 보기 ---------- */
  function tileDemo(host) {
    const inner = T.connectedFrom(T.tiling('3.4.6.4', c => Math.hypot(c[0], c[1]) < 2.4));

    const inSet = new Set(inner.map(key));
    const ext = outer.filter(p => !inSet.has(key(p)));
    const s = svgBox([-4.6, -4.2, 4.6, 4.2], 760, 700);
    host.appendChild(s);
    const reg = grout(s, inner.map(p => p.v));
    const sortD = arr => arr.map(p => ({ p, d: Math.hypot(...G.centroid(p.v)) })).sort((a, b) => a.d - b.d);
    const A = sortD(inner).map((o, i) => ({ e: poly(s, o.p.v, o.p.n, s, { opacity: 0 }), i }));
    const B = sortD(ext).map((o, i) => ({ e: poly(s, o.p.v, o.p.n, s, { opacity: 0 }), i }));
    // 꽉 찬 꼭짓점 점
    const vs = G.analyzeVertices(inner.map(p => p.v)).filter(v => Math.abs(v.sum - 360) < 0.01);
    const dots = vs.map(v => el('circle', { cx: s.X([v.x, v.y]), cy: s.Y([v.x, v.y]), r: 6, style: 'fill:var(--gold);stroke:var(--ink);stroke-width:2', opacity: 0 }, s));

    lt.textContent = '꽉 찬 꼭짓점이 모두 3.4.6.4';
    return loop(T0 => {
      const t = REDUCE ? 12 : T0 % 12.5;

  /* ---------- 작은 그림 ---------- */
  // 밑변이 바닥에 놓인 정다각형 아이콘
  function polyIcon(n) {
    const P = [];
    for (let k = 0; k < n; k++) { const a = (-90 + 180 / n + k * 360 / n) * Math.PI / 180; P.push([Math.cos(a), -Math.sin(a)]); }
    const xs = P.map(p => p[0]), ys = P.map(p => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const k = 88 / Math.max(x1 - x0, y1 - y0), ox = 50 - (x0 + x1) / 2 * k, oy = 50 - (y0 + y1) / 2 * k;
    const d = P.map(p => (ox + p[0] * k).toFixed(1) + ',' + (oy + p[1] * k).toFixed(1)).join(' ');
    return `<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="${d}" style="fill:var(--c${n});stroke:rgba(0,0,0,.28);stroke-width:3;stroke-linejoin:round"/></svg>`;
  }

    if (kind === 1) return C.svgOfPolys(T.tiling('6.6.6', near(1.9)).map(p => ({ v: p.v, n: p.n, kind: 'piece' })), { pad: 0.12 });
    if (kind === 2) return C.svgOfPolys(T.tiling('4.8.8', near(2.5)).map(p => ({ v: p.v, n: p.n, kind: 'piece' })), { pad: 0.12 });
    const pcs = T.connectedFrom(T.tiling('3.4.6.4', near(1.9)));
    const v = pcs.map(p => p.v);
    const items = v.map(x => ({ v: x, kind: 'grout' })).concat(pcs.slice(0, 3).map(p => ({ v: p.v, n: p.n, kind: 'piece' })));

    let svg = C.svgOfPolys(items, { pad: 0.35, edges: G.boundarySegments([hex]), edgeW: 1.6 });
    return svg;
  }

    </ol></div>
    <div class="demo"><div class="mock"><h4>들어가기</h4><span class="lab">반</span><div class="seg"><span>1학년 1반</span><span class="on">1학년 2반</span><span>1학년 3반</span></div>
      <div class="fields"><div><span class="lab">번호</span><div class="f mono">12</div></div><div><span class="lab">이름</span><div class="f">김하늘</div></div></div><span class="go">시작하기</span></div></div></div>`);
  add(`<div class="s-top">${eb(6, '조작 1')}<h2 class="s-title">조각 놓기</h2></div>
    <div class="cols"><div class="txt"><ul class="pts">
      <li>아래 받침의 조각을 <b>끌어서</b> 회색 자리 가까이 가져가요</li>
      <li>가까이 가면 맞는 방향으로 <b>착 붙어요</b><small>돌릴 필요가 없어요.</small></li>
      <li><b>빨간 점선</b>이 보이면 겹치거나 회색 밖으로 나가는 자리예요</li>
      <li>받침의 숫자는 남은 조각 수예요</li>
    </ul></div><div class="demo" data-demo></div></div>`, dragDemo);
  add(`<div class="s-top">${eb(8, '조작 2')}<h2 class="s-title">틀렸을 때, 막혔을 때</h2></div>
    <div class="cardgrid tools">
      <div class="ccard"><h3><span class="ib">${ICON.del}</span>조각 빼기</h3><p>판의 조각을 <b>우클릭</b>하거나 <b>두&nbsp;번</b>&nbsp;눌러요. 받침으로 끌어내도 돼요.</p></div>
      <div class="ccard"><h3><span class="ib">${ICON.undo}</span>되돌리기</h3><p><span class="key">Ctrl</span> + <span class="key">Z</span> 또는 되돌리기 단추. 몇&nbsp;번이고 뒤로 갈 수 있어요.</p></div>
      <div class="ccard"><h3><span class="ib">${ICON.reset}</span>다시</h3><p>처음부터 다시 놓아요. 놓은 조각이 모두 받침으로 돌아가요.</p></div>
      <div class="ccard"><h3><span class="ib">${ICON.hint}</span>힌트</h3><p>조각 하나의 자리를 깜빡여 알려&nbsp;줘요. 대신 <b>별은 하나</b>만 받아요.</p></div>
      <div class="ccard"><h3><span class="ib">${ICON.fit}</span>판 움직이기</h3><p>빈 곳을 끌면 이동, <b>마우스 휠</b>로 확대. 맞춤 단추로 처음 크기로.</p></div>
      <div class="ccard"><h3><span class="ib">${ICON.back}</span>목록으로</h3><p>왼쪽 위 단추로 단계 목록에 가요. 푼&nbsp;퍼즐에는 별이 남아요.</p></div>
    </div>`);
  add(`<div class="s-top">${eb(12, '별')}<h2 class="s-title">별 두 개 받는 법</h2></div>
    <p class="s-lead">완성하면 <span class="gs">★</span> 하나, 퍼즐마다 정해진 조건까지 해내면 <span class="gs">★★</span> 둘이에요.</p>
    <div class="cardgrid stars3">
      <div class="ccard"><span class="m-no">보통 퍼즐</span>${hintArt()}<h3>힌트 없이 완성</h3><p>힌트를 쓰면 별 하나예요.</p></div>
      <div class="ccard"><span class="m-no">최소 조각 도전</span>${fewArt()}<h3>정한 개수 이하로</h3><p>조각 수를 가장 적게 써 봐요.</p></div>
      <div class="ccard"><span class="m-no">3단계 꽃 찾기</span>${flowersArt()}<h3>꽃을 모두 찾기</h3><p>모양이 다른 꽃을 빠짐없이 찾아요.</p></div>
    </div>
    <p class="note">${ICON.reset}별이 하나뿐인 퍼즐은 목록에서 다시 골라 별 둘에 도전할 수 있어요.</p>`);
  add(`<div class="s-top">${eb(3, '1·2단계')}<h2 class="s-title">첫 조각 · 딱 맞게</h2></div>
    <div class="cols"><div class="txt"><ul class="pts">
      <li><b>1단계</b> 집, 고양이, 별 … 끌어다 놓기를 익혀요</li>
      <li><b>2단계</b> 받침의 조각을 <b>남김없이</b> 다 써야 해요<small>무엇을 어디에 놓을지 먼저 생각해 봐요.</small></li>
      <li>막히면 큰 조각의 자리부터 다시 생각해 봐요</li>
      <li><b>최소 조각 도전</b> 조각 수를 가장 적게!</li>
    </ul></div>
    <div class="demo"><div class="thumbs">
      <div class="th">${levelThumb('1-1')}<span><em>1-1</em>집</span></div><div class="th">${levelThumb('1-4')}<span><em>1-4</em>고양이</span></div>
      <div class="th">${levelThumb('2-3')}<span><em>2-3</em>정십이각형</span></div><div class="th">${levelThumb('2-4')}<span><em>2-4</em>큰 육각형</span></div>
    </div></div></div>`);
  add(`<div class="s-top">${eb(4, '3단계')}<h2 class="s-title">한 점에 모으기</h2></div>
    <div class="cols"><div class="txt"><ul class="pts">
      <li>가운데 <b>점 둘레</b>를 조각으로 채워요</li>
      <li>고리에 <b>모인 각도</b>가 보여요<small>꽃이 완성될 때 몇 도인지 살펴보세요.</small></li>
      <li>모양이 다른 꽃을 <b>모두</b> 찾으면 별 둘</li>
      <li>정말 만들 수 없는 꽃이라면 <b>만들 수 없어요</b> 단추!</li>
    </ul></div><div class="demo" data-demo></div></div>`, ringDemo);
  add(`<div class="s-top">${eb(6, '4단계')}<h2 class="s-title">무늬 채우기</h2></div>
    <div class="cols"><div class="txt"><ul class="pts">
      <li>같은 규칙이 되풀이되는 <b>무늬</b>를 채워요</li>
      <li>빗금 친 조각은 미리 놓여 있는 <b>출발 조각</b>이에요</li>
      <li>완성하면 꼭짓점 이름이 나와요<small><span class="mono">3.4.6.4</span> = 한 점을 둘러싼 조각들의 변의 수</small></li>
      <li><b>끝없이 이어 보기</b>로 무늬를 넓혀 봐요</li>
    </ul></div><div class="demo" data-demo></div></div>`, tileDemo);
  add(`<div class="s-top">${eb(8, '5단계')}<h2 class="s-title">나만의 모양</h2><span class="s-tag">선생님이 열어 주시면</span></div>
    <ol class="flow">
      <li><b>무늬 만들기</b><small>조각을 마음껏</small></li>
      <li><b>규칙 무늬</b><small>꼭짓점이 모두 같은 모양</small></li>
      <li><b>퍼즐로 만들기</b><small>이름 짓고 코드 받기</small></li>
      <li><b>패들렛에 코드</b><small>복사해서 올리기</small></li>
      <li><b>친구 퍼즐 풀기</b><small>코드 붙여 넣기</small></li>
    </ol>
    <div class="cardgrid mis">
      <div class="ccard"><div class="m-art">${missionArt(1)}</div><span class="m-no">미션 1</span><h3>한 가지 조각으로 규칙 무늬</h3><p>꽉 찬 꼭짓점 6개 이상</p></div>
      <div class="ccard"><div class="m-art">${missionArt(2)}</div><span class="m-no">미션 2</span><h3>두 가지 이상 조각으로 규칙 무늬</h3><p>'같은 규칙으로 넓히기'도 눌러 봐요</p></div>
      <div class="ccard"><div class="m-art">${missionArt(3)}</div><span class="m-no">미션 3</span><h3>조각 8개 이상으로 나만의 퍼즐</h3><p>친구가 풀 수 있게 코드로 나눠요</p></div>
    </div>`);
  add(`<div class="s-top">${eb(12, '도감')}<h2 class="s-title">꼭짓점 도감 15칸</h2></div>
    <div class="cols wide-r"><div class="txt"><ul class="pts">
      <li>한 점을 정다각형으로 <b>빈틈없이</b> 둘러싸는 방법은 모두 <b>15가지</b></li>
      <li>퍼즐을 풀거나 무늬를 만들다 찾으면 <b>도감에 저절로</b> 모여요</li>
      <li>목록 아래 <b>꼭짓점 도감</b>에서 언제든 펼쳐 봐요</li>
    </ul></div><div class="demo"><div class="dexgrid">${C.DEX_ALL.map((c, i) => [0, 4, 5, 7, 14].includes(i) ? `<div class="got">${C.flowerSVG(c)}</div>` : '<div>?</div>').join('')}</div></div></div>`);
  add(`<div class="s-top">${eb(3, '마무리')}<h2 class="s-title">기록 남기기</h2></div>
    <div class="cols"><div class="txt"><ol class="steps">
      <li><span>첫 화면에서 <b>나의 기록</b>을 열어요</span></li>
      <li><span><b>생각 쓰기</b>에 답을 써요<small>정오각형으로는 왜 한 점을 빈틈없이 둘러쌀 수 없을까요? 각의&nbsp;크기로 설명해 봐요.</small></span></li>
      <li><span><b>그림으로 저장</b>하거나 <span class="kc"><span class="key">Win</span> + <span class="key">Shift</span> + <span class="key">S</span>로</span> 캡처해요</span></li>
      <li><span><b>패들렛</b>에 올리면 끝!</span></li>
    </ol></div>
    <div class="demo">${recordArt()}</div></div>`);
  add(`<div class="s-top">${eb(4, '정리')}<h2 class="s-title">한 장 요약</h2></div>
    <div class="sumgrid">
      <div class="sumc"><h3><i>1</i>시작</h3><ul><li class="ad">${addrBox()}</li><li>반 고르기 → <b>번호·이름</b> → 시작하기</li><li>기록은 선생님께 <b>저절로 저장</b></li></ul></div>
      <div class="sumc"><h3><i>2</i>규칙</h3><ul><li><b>겹치지 않게, 빈틈없이</b></li><li>가까이 가져가면 맞는 방향으로 <b>착</b></li><li>빨간 점선 = 겹침 · 회색 밖</li></ul></div>
      <div class="sumc"><h3><i>3</i>조작</h3><ul><li>끌어서 놓기 · <b>우클릭</b>으로 빼기</li><li><span class="kc"><span class="key">Ctrl</span>+<span class="key">Z</span></span> 되돌리기 · 다시</li><li>힌트는 별 하나 · 휠로 확대</li></ul></div>
      <div class="sumc"><h3><i>4</i>단계</h3><div class="lvls"><div><b>1</b>첫 조각 · 끌어다 놓기 익히기</div><div><b>2</b>딱 맞게 · 조각을 남김없이</div><div><b>3</b>한 점에 모으기 · 꽃 모두 찾기</div><div><b>4</b>무늬 채우기 · 끝없이 이어 보기</div><div class="five"><b>5</b>나만의 모양 · 선생님이 열면</div></div></div>
      <div class="sumc"><h3><i>5</i>별 · 도감</h3><ul><li><span class="gs">★</span> 완성 · <span class="gs">★★</span> 힌트 없이</li><li>최소 조각은 정한 개수 이하, 꽃은 모두&nbsp;찾기</li><li>꼭짓점 도감 <b>15칸</b> 채우기</li></ul></div>
      <div class="sumc"><h3><i>6</i>기록</h3><ul><li><b>나의 기록</b> → 생각 쓰기</li><li>그림으로 저장 또는 <span class="kc"><span class="key">Win</span>+<span class="key">Shift</span>+<span class="key">S</span></span></li><li><b>패들렛</b>에 올리기</li></ul></div>
    </div>`, null, 'sum');

  function okMark() { return `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" style="fill:var(--good)"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
  function noMark() { return `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" style="fill:var(--bad)"/><path d="M8 8l8 8M16 8l-8 8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>`; }
  function recordArt() {
    const box = (x, y, k, v) => `<rect x="${x}" y="${y}" width="154" height="92" rx="14" style="fill:var(--surface);stroke:var(--line)"/><text x="${x + 16}" y="${y + 30}" style="font-size:19px;fill:var(--ink-2);font-family:var(--f-sans)">${k}</text><text x="${x + 16}" y="${y + 74}" style="font-size:38px;fill:var(--ink);font-family:var(--f-sans);font-weight:800;letter-spacing:-1px">${v}</text>`;
    return `<svg viewBox="0 0 640 560" class="dsvg" aria-hidden="true"><rect x="40" y="30" width="560" height="500" rx="26" style="fill:var(--surface);stroke:var(--line);stroke-width:2"/>
      <text x="76" y="92" style="font-size:40px;fill:var(--ink);font-family:var(--f-sans);font-weight:800;letter-spacing:-1px">나의 기록</text>
      ${box(76, 120, '해결한 퍼즐', '19 / 28')}${box(243, 120, '꼭짓점 도감', '11 / 15')}${box(410, 120, '규칙 무늬', '2종')}
      <text x="76" y="268" style="font-size:20px;fill:var(--ink-2);font-family:var(--f-sans)">생각 쓰기</text>
      <rect x="76" y="282" width="488" height="150" rx="14" style="fill:var(--board);stroke:var(--line)"/>
      <text x="96" y="322" style="font-size:22px;fill:var(--ink-3);font-family:var(--f-sans)">정오각형의 한 각은 …</text>
      <rect x="370" y="458" width="194" height="50" rx="14" style="fill:var(--accent)"/><text x="467" y="491" text-anchor="middle" style="font-size:22px;fill:var(--surface);font-family:var(--f-sans);font-weight:700">그림으로 저장</text></svg>`;
  }

  /* ---------- 그리기와 넘기기 ---------- */
  const stage = $('#stage');
  stage.innerHTML = S.map((s, i) => `<section class="slide ${s.cls}" data-i="${i}" aria-label="${i + 1} / ${S.length}">${s.html}</section>`).join('');
  $('#dots').innerHTML = S.map((s, i) => `<button aria-label="${i + 1}번 슬라이드" data-go="${i}"></button>`).join('');
  let cur = -1, stopFn = null;
  function go(i) {
    i = Math.max(0, Math.min(S.length - 1, i));
    if (i === cur) return;
    if (stopFn) { stopFn(); stopFn = null; }
    $$('.slide').forEach((el, k) => { el.classList.toggle('on', k === i); el.classList.toggle('past', k < i); });
    const sl = $$('.slide')[i];
    const host = sl.querySelector('[data-demo]');
    if (host && S[i].demo) { host.innerHTML = ''; stopFn = S[i].demo(host); }
    cur = i;
    $$('#dots button').forEach((b, k) => b.classList.toggle('on', k === i));
    $('#count').textContent = `${i + 1} / ${S.length}`;
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) { }
  }
  function fit() {
    const f = $('#frame').getBoundingClientRect();
    const k = Math.min(f.width / 1640, f.height / 930);
    stage.style.transform = `translate(${(f.width - 1600 * k) / 2}px, ${(f.height - 900 * k) / 2}px) scale(${k})`;
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe($('#frame'));
  const editing = () => document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('addr');
  document.addEventListener('keydown', e => {
    if (editing()) { if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); document.activeElement.blur(); } return; }
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(cur + 1); }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(S.length - 1);
    else if (e.key === 'f' || e.key === 'F' || e.key === 'ㄹ') toggleFS();
  });
  $('#prev').addEventListener('click', () => go(cur - 1));
  $('#next').addEventListener('click', () => go(cur + 1));
  $('#dots').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(+b.dataset.go); });
  function toggleFS() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else (document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : Promise.reject()).catch(() => { });
    } catch (e) { }
  }
  $('#fs').addEventListener('click', toggleFS);
  let down = null;
  $('#frame').addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: Date.now() }; });
  $('#frame').addEventListener('pointerup', e => {
    if (!down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y; const d0 = down; down = null;
    if (e.target.closest('.addr, a, button, input')) return;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) { go(cur + (dx < 0 ? 1 : -1)); return; }
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8 && Date.now() - d0.t < 600) {
      const f = $('#frame').getBoundingClientRect();
      go(cur + ((e.clientX - f.left) < f.width * 0.3 ? -1 : 1));
    }
  });
  document.addEventListener('input', e => {
    if (!e.target.classList || !e.target.classList.contains('addr')) return;
    ADDR = e.target.textContent.trim();
    try { localStorage.setItem('binteum.guide.addr', ADDR); } catch (err) { }
    for (const a of $$('.addr')) if (a !== e.target) a.textContent = ADDR;
  });
  fit();
  const h = parseInt((location.hash || '').replace('#', ''), 10);
  go(isFinite(h) && h >= 1 ? h - 1 : 0);
  window.GUIDE = { go, count: S.length };
})();

</script>
</body>
</html>
